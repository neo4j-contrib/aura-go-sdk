      UserID(value string) and InviteID(value string). Both must use the UUID format
      (uuidPattern — xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx). Include clear missing and
      invalid error messages consistent with the existing validators. Add tests in
      utils_test.go covering empty, malformed, and valid values for each.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "UserID constructor exists, returns UUID-format RequiredID with descriptive error messages"
      - "InviteID constructor exists, returns UUID-format RequiredID with descriptive error messages"
