kind: Changed
body: 'v2beta1: all v2beta1 service operations now take variadic ScopeOption values instead of positional orgID, projectID, instanceID and databaseID string parameters; backup, user and invite identifiers are added as scope leaves. The scope is supplied per call with WithOrg, WithProject, WithInstance, WithDatabase, WithBackup, WithUser or WithInvite, or once at client construction with WithDefaultOrg, WithDefaultProject and WithDefaultInstance, where a per-call option overrides the matching default and an unset field inherits it. Operations that carry a request body take that body before the trailing scope options.'
time: 2026-11-10T18:32:44.641381Z
